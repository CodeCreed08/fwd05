<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home - Mess Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <button class="close-btn" onclick="toggleMenu()">×</button>
        <a href="student-dashboard.html">🏠 Dashboard</a>
        <a href="qrscan.html">📷 Scan QR</a>
        <a href="student-profile.html">👤 My Profile</a>
        <a href="student-login.html" style="margin-top: 20px; color: #ff6b6b;">🚪 Logout</a>
    </nav>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <header>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h1>Mess Portal</h1>
        <div></div>
    </header>
    <main>
        <fieldset>
            <legend>Account Overview</legend>
            <div class="stat-grid">
                <div class="stat-box">
                    <p>Wallet Balance</p>
                    <div class="stat-value">₹450</div>
                </div>
                <div class="stat-box">
                    <p>Plan Remaining</p>
                    <div class="stat-value">24<small style="font-size: 0.9rem"> Days</small></div>
                </div>
            </div>
        </fieldset>
        <fieldset>
            <legend>Top-up & Renew</legend>
            <p style="font-size: 0.9rem; color: #555; margin-bottom: 10px;">Add funds for pay-per-meal or renew your monthly plan.</p>
            <form onsubmit="event.preventDefault(); alert('Redirecting to payment gateway...');">
                <input type="number" placeholder="Enter amount (₹)" required>
                <button type="submit" class="btn">Proceed to Pay</button>
            </form>
        </fieldset>
        <center>
                <a href="qrscan.html">
                    <input type="button" value="📷 Scan Mess QR Counter">
                </a>
        </center>
    </main>
    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
    </script>
</body>
</html>
