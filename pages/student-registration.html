<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Mess Card</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="../index.html" class="logo">Mess Card</a>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="student-login.html">Student Login</a></li>
                <li><a href="staff-login.html">Staff Login</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="auth-container">
            <h2 class="section-title">Register Account</h2>
            <p class="section-subtitle">Create your digital dining profile.</p>
            <form id="registrationForm">
                <label for="studentName">Full Name</label>
                <input type="text" id="studentName" placeholder="Enter your full name" required>
                <label for="enrollment">Student ID / Roll Number</label>
                <input type="text" id="enrollment" placeholder="e.g., SAU/2026/BTECH/01" required>
                <label for="category">Student Category</label>
                <select id="category" onchange="showPaymentOptions()" required>
                    <option value="">-- Select Category --</option>
                    <option value="Hostler">Hostler</option>
                    <option value="Day Scholar">Day Scholar</option>
                </select>
                <div id="hostlerOptions" style="display:none; background: #dbeafe; padding: 20px; border-radius: 12px; margin-top: 20px; border-left: 5px solid #2563eb;">
                    <label for="messPlan" style="margin-top: 0;">Hostler Mess Plan</label>
                    <select id="messPlan">
                        <option value="3400">Vegetarian - ₹3400/month</option>
                        <option value="3800">Non-Vegetarian - ₹3800/month</option>
                    </select>
                </div>
                <div id="dayScholarOptions" style="display:none; background: #dbeafe; padding: 20px; border-radius: 12px; margin-top: 20px; border-left: 5px solid #2563eb;">
                    <p style="margin-bottom: 15px; font-size: 0.95rem; color: #1e3a8a;"><strong>Day Scholar Wallet Rates:</strong><br> Lunch: ₹70 | Dinner: ₹70</p>
                    <label for="initialRecharge" style="margin-top: 0;">Initial Wallet Recharge (₹)</label>
                    <input type="number" id="initialRecharge" placeholder="Enter amount to add to wallet">
                </div>
                <button type="button" class="btn primary" onclick="registerStudent()">Complete Registration</button>
            </form>
        </section>
    </main>
    <script src="../js/app.js"></script>
</body>
</html>
