<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Counter - Mess Card</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header>
        <hgroup>
            <h1>Mess Counter Station</h1>
            <p>Counter QR Display</p>
        </hgroup>
    </header>
    <nav>
        <a href="staff-scanner.html">Counter QR</a> |
        <a href="staff-login.html">Logout</a>
    </nav>
    <main>
        <section style="text-align: center;">
            <h2>Daily Counter QR Code</h2>
            <p style="color: #666; margin-bottom: 15px;"><small>Students scan this to log their meal.</small></p>
            <div style="width: 100%; max-width: 300px; background: #ffffff; padding: 20px; margin: 15px auto; border-radius: 8px; border: 1px solid #ddd; display: flex; flex-direction: column; align-items: center;">
                <div id="qrcode"></div>
                <p id="qr-text" style="font-size: 0.8rem; color: #555; margin-top: 10px;"></p>
            </div>
            <button onclick="generateQR()" style="margin-bottom: 20px; padding: 8px 16px;">Generate New QR</button>
        </section>
        <section style="margin-top: 20px;">
            <fieldset>
                <legend>Manual ID Entry</legend>
                <form onsubmit="event.preventDefault(); alert('Card verified manually!');">
                    <label for="card_id"><strong>Student ID</strong></label><br>
                    <input type="text" id="card_id" placeholder="e.g., SAU/2026/BTECH/01" required>
                    <button type="submit">Verify</button>
                </form>
            </fieldset>
        </section>
    </main>
    <footer>
        <address>South Asian University</address>
    </footer>
    <script>
        function generateQR() {
            const today = new Date().toISOString().slice(0, 10);
            const qrString = "SAU_MESS_" + today;
            const container = document.getElementById("qrcode");
            container.innerHTML = ""; 
            new QRCode(container, {
                text: qrString,
                width: 200,
                height: 200
            });
            document.getElementById("qr-text").innerText = "Data: " + qrString;
        }
        window.onload = generateQR;
    </script>
</body>
</html>
